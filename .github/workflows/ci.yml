name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ../TradingAgents-astock
          pip install ruff
      - name: Lint
        run: ruff check app/ main.py task_worker.py maintenance_cli.py migrations/ tests/
      - name: Tests
        run: pytest -q

  tradingagents:
    name: TradingAgents-astock tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TradingAgents-astock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: TradingAgents-astock/pyproject.toml
      - name: Install package
        run: pip install -e .
      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend (typecheck + lint + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript (tsc --noEmit)
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
