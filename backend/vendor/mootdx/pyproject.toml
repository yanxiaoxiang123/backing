[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mootdx"
# Local patched build of PyPI mootdx 0.11.7: identical runtime code, metadata
# only difference is the relaxed httpx bound (see README.md in this directory).
version = "0.11.7.post1"
description = "通达信数据读取接口 (vendored, httpx constraint patched)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "bopo", email = "ibopo@126.com" }]
requires-python = ">=3.8,<4.0"
dependencies = [
    "click>=8.1.3,<9.0.0",
    # PATCHED: upstream 0.11.7 pins httpx>=0.25,<0.26, which conflicts with
    # fastapi/starlette (httpx>=0.27) and the app's working httpx 0.28.x.
    # Runtime-verified compatible with httpx 0.28 (imports + Quotes work).
    "httpx>=0.25,<0.29",
    "prettytable>=3.5.0,<4.0.0",
    "py-mini-racer>=0.6.0,<0.7.0",
    "tdxpy>=0.2.5,<0.3.0",
    "tenacity>=8.1.0,<9.0.0",
    "tqdm",
    "typing-extensions>=4.5.0,<5.0.0",
]

[project.scripts]
mootdx = "mootdx.__main__:entry"

[tool.setuptools]
packages = [
    "mootdx",
    "mootdx.cache",
    "mootdx.contrib",
    "mootdx.financial",
    "mootdx.tools",
    "mootdx.utils",
]
include-package-data = true

[tool.setuptools.package-data]
"mootdx.utils" = ["*.js"]
