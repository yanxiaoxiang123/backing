# quant profile（草案 — 运行时构建后校验）
#
# 固定 commit 47f9438 的 Cordis 组合；目标：移除 Bash/编辑器/宿主文件工具，
# 只保留对话、只读量化工具（经 FastAPI Tool Gateway）与人工审批。
# 注意：本文件为装配草案；DSH Cordis 语法与插件清单以该 commit 的
# examples/ 与 docs/cordis-primer.md 为准，构建后逐项校验。

entry:
  # - bash: disabled            # 默认移除宿主 Bash
  # - fs.edit: disabled         # 禁止编辑宿主文件
  # - subprocess: disabled      # 禁止任意子进程
  # - quant.gateway: enabled    # 自定义量化工具消费者（TS 插件，后续切片）
  # - interaction: enabled      # 人工审批（approval）

config:
  model:
    provider: deepseek-official   # DeepSeek 官方端点
  quant:
    gateway_base_url: http://127.0.0.1:8808/api/v1
    auth_header: X-API-Key        # 凭据经 env/credentials 注入，不入库
